<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registro - Bingo</title>
  <link rel="stylesheet" href="/public/css/estilo.css">
</head>
<body>
  <div class="page-wrapper">
    <div class="card" role="main" aria-labelledby="registerTitle">
      <div class="logo" aria-hidden="true">
        <!-- simple icon -->
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2Z" fill="#203040" opacity="0.95"/>
          <path d="M21 21H3C3 16.6 6.6 13 11 13H13C17.4 13 21 16.6 21 21Z" fill="#203040" opacity="0.9"/>
        </svg>
      </div>

      <h2 id="registerTitle" class="title">Crear una cuenta</h2>
      <div class="subtitle">Ingresa tus datos para comenzar a jugar.</div>

      <form id="registerForm" action="#" method="post" novalidate>
        <div class="form-group input-wrap">
          <!-- user icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-user"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input class="input" id="nombre" name="nombre" type="text" placeholder="Tu nombre completo" required>
        </div>

        <div class="form-group input-wrap">
          <!-- email icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M4 6H20V18H4V6Z" stroke="#1f2d3d" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
            <path d="M4 6L12 13L20 6" stroke="#1f2d3d" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
          </svg>
          <input class="input" id="correo" name="correo" type="email" placeholder="tu@correo.com" required>
        </div>

        <div class="form-group input-wrap">
          <!-- lock icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="11" width="18" height="10" rx="2" stroke="#1f2d3d" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
            <path d="M7 11V8C7 5.8 8.8 4 11 4C13.2 4 15 5.8 15 8V11" stroke="#1f2d3d" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
          </svg>
          <input class="input" id="contrasena" name="contrasena" type="password" placeholder="Crea una contraseña" required>
        </div>

        <div class="form-group">
          <button class="btn" type="submit">Crear cuenta</button>
        </div>
      </form>

      <div class="muted-links">
        ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
      </div>
    </div>

    <div class="floating-images">
      <img src="/public/img/image.png" alt="" class="floating-image">
      <img src="/public/img/image copy 2.png" alt="" class="floating-image">
      <img src="/public/img/image copy.png" alt="" class="floating-image">
      <img src="/public/img/image copy 3.png" alt="" class="floating-image">
    </div>
  </div>

  <script src="/public/js/index.js"></script>
</body>
</html>
